- type: shader
  id: FlickerHologram
  kind: source
  path: "/Textures/_White/Shaders/flickerhologram.swsl"
  light_mode: unshaded
  params:
    jitter: 0.5
    colorJitter: 0.4
    alphaJitter: 0.5
    hue: 0.48

- type: shader
  id: FlickerHologramGlitch
  kind: source
  path: "/Textures/_White/Shaders/flickerhologram.swsl"
  light_mode: unshaded
  params:
    jitter: 5
    colorJitter: 0.8
    alphaJitter: 1
    hue: 0.48

- type: shader
  id: Grain
  kind: source
  path: "/Textures/_White/Shaders/grain.swsl"
  params:
    strength: 100.0

- type: shader
  id: RemoteControl
  kind: source
  path: "/Textures/_White/Shaders/remotecontrol.swsl"

- type: shader
  id: Crt2
  kind: source
  path: "/Textures/Shaders/crt2.swsl"
  params:
    res: 900, 600
    mask_type: 0
    bloom_type: 0
    hardScan: -8.0
    hardPix: -2.0
    hardBloomScan: -2.0
    hardBloomPix: -1.5
    bloomAmount: 16.0
    maskDark: 0.5
    maskLight: 1.5
    warp: 64.0, 24.0
